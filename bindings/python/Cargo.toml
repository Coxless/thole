[package]
name = "thole-py"
description = "Python bindings for thole."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_thole"
crate-type = ["cdylib"]
# The extension module is tested from Python (tests/), not with `cargo test`.
test = false
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
thole.workspace = true

[lints]
workspace = true
