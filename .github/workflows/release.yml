name: Release

# Pushing a tag `v<version>` publishes that version to crates.io and PyPI and
# creates a GitHub release. Running the workflow by hand does everything
# except the uploads.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      # The crates and the Python package share the workspace version.
      - id: version
        run: |
          version=$(cargo metadata --format-version 1 --no-deps |
            python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "thole"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi

  # All checks, regardless of which files changed.
  ci:
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          working-directory: bindings/python
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: bindings/python
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist

  # Installs the built wheel into a clean environment and runs the Python tests.
  test-wheel:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wheel-x86_64
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
      - run: |
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv/bin/python pytest dist/*.whl
          cd bindings/python
          /tmp/venv/bin/python -m pytest

  publish-crates:
    needs: [version, ci, wheels, sdist, test-wheel]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      # Skips what is already published and waits out the rate limit of
      # crates.io, so a failed job can simply be run again.
      - run: scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-pypi:
    needs: [version, ci, wheels, sdist, test-wheel]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [version, publish-crates, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
