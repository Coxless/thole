name: CI

# Pull requests only. A push to a branch with an open pull request would
# otherwise run everything twice, and a push to `main` is always the merge of a
# pull request that has just passed while up to date with `main`.
on:
  pull_request:
  # Called by the release workflow, which runs every job.
  workflow_call:
    inputs:
      all:
        description: Run every job regardless of which files changed.
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The checks themselves live in scripts/check.sh. Each job below only sets up
# its tools, and runs only when the files it covers have changed.
jobs:
  changes:
    if: ${{ !inputs.all }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      lean: ${{ steps.filter.outputs.lean }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Changes here affect every job.
            shared: &shared
              - '.github/workflows/**'
              - 'scripts/**'
            rust: &rust
              - *shared
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/*/Cargo.toml'
              - 'crates/*/src/**'
              - 'crates/*/tests/**'
              - 'crates/*/benches/**'
              - 'crates/*/examples/**'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/src/**'
            # The bindings are built from the Rust code, so Rust changes count.
            python:
              - *rust
              - 'bindings/python/**'
              - 'crates/*/python/**'
            lean:
              - *shared
              - 'lakefile.toml'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'crates/*/lean/**'

  rust:
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check.sh rust package

  python:
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.python == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - run: scripts/check.sh python

  lean:
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.lean == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Lean and restores the Mathlib and build caches. The build
      # itself is left to scripts/check.sh.
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
      - run: scripts/check.sh lean

  # The single status that branch protection requires. Jobs skipped because
  # nothing they cover has changed count as passing.
  ci:
    if: always()
    needs: [changes, rust, python, lean]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
