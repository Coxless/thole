# Workshop definition (thole)
# Reference: https://ubuntu.com/workshop/docs/reference/definition-files/workshop-definition/
#
# - `name` must match the file name (.workshop/<name>.yaml)
# - after changing `base` or `sdks`, apply with `workshop refresh`
# - changes to `actions` take effect immediately, no refresh needed
#
# Rust, Python and Lean exist only inside the workshop. Nothing is installed on the host.

name: dev
base: ubuntu@24.04

sdks:
  - name: rust          # rustup; the version follows rust-toolchain.toml
  - name: uv            # builds the Python bindings (bindings/python) and runs the Python tests
  - name: project-elan  # in-project SDK in .workshop/elan/ (the Store has no Lean SDK)

# Named scripts, run with `workshop run -- <action> [args...]`.
# They run under bash (errexit + pipefail). The project is mounted at /project.
actions:
  setup: |
    cd /project
    cargo fetch
    (cd bindings/python && uv sync)
    lake build

  # The checks themselves are defined in scripts/check.sh, which CI runs too.

  # Run tests while developing. Arguments go to cargo test,
  # e.g. `workshop run -- test -p thole-roots bisect`.
  test: |
    cd /project
    cargo test --all-features "$@"

  fmt: |
    cd /project
    cargo fmt --all "$@"

  # Start JupyterLab on the notebooks in crates/<crate>/notebooks/, with a Python
  # kernel that has `thole` rebuilt from the working tree and a Rust kernel
  # (evcxr), which is installed on first use. Arguments go to `jupyter lab`.
  # Open the printed URL from the host; stop with Ctrl-C.
  notebook: |
    kernel="$HOME/.cargo/bin/evcxr_jupyter"
    if [ ! -x "$kernel" ]; then
      cargo install --locked evcxr_jupyter
    fi
    "$kernel" --install
    cd /project/bindings/python
    echo "From the host, replace 127.0.0.1 in the URL below with $(hostname -I | cut -d' ' -f1)"
    uv run --reinstall-package thole \
      --with jupyterlab --with scipy --with mpmath --with matplotlib \
      jupyter lab --ip=0.0.0.0 --no-browser --notebook-dir=/project/crates "$@"

  # Run checks: `workshop run -- check rust`, `check python`, `check lean`,
  # `check package`, or several at once. Without arguments, runs everything CI can run.
  check: |
    cd /project
    if [ $# -eq 0 ]; then set -- all; fi
    scripts/check.sh "$@"
