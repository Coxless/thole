# Lean code for the thole crates. Each crate keeps its definitions and proofs
# next to its Rust code, in `crates/<crate>/lean/`, as one library of this
# package. The oracle that the Rust results are checked against is in
# `oracle/lean/`: a library, and the executable `thole-oracle`.
name = "thole"
defaultTargets = ["TholeRoots", "TholeOracle", "thole-oracle"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "TholeRoots"
srcDir = "crates/thole-roots/lean"
globs = ["Thole.Roots.+"]

[[lean_lib]]
name = "TholeOracle"
srcDir = "oracle/lean"
globs = ["Thole.Oracle.+"]

[[lean_exe]]
name = "thole-oracle"
srcDir = "oracle/lean"
root = "Main"
